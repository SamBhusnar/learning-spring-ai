# App
spring.application.name=reerAI2

# Ollama (local)
spring.ai.ollama.host=http://localhost:11434
spring.ai.ollama.chat.enabled=true

# NVIDIA NIM via OpenAI-compatible API
spring.ai.openai.base-url=https://integrate.api.nvidia.com
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.chat.options.model=meta/llama3-8b-instruct
spring.ai.openai.chat.options.max-tokens=512
spring.ai.openai.chat.options.temperature=0.3
logging.level.org.springframework.ai=DEBUG
